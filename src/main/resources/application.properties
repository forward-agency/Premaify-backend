spring.application.name=premaify-backend
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:premaify}?createDatabaseIfNotExist=true&useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

premaify.cors.allowed-origins=${PREMAIFY_CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,https://www.premaify.com}

premaify.super-admin.email=${SUPER_ADMIN_EMAIL:premaify@gmail.com}
premaify.super-admin.password=${SUPER_ADMIN_PASSWORD:premaify@SPP}

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_USERNAME:}
spring.mail.password=${BREVO_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

premaify.mail.from=${BREVO_SMTP_FROM:support.premaify@gmail.com}
premaify.mail.admin-to=${ADMIN_NOTIFICATION_EMAIL:premaify@gmail.com}
premaify.site.base-url=${PREMAIFY_SITE_BASE_URL:https://www.premaify.com}
